name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dbt package versions are plain semver: strip the leading "v" from the tag
      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_major=$(( ${VERSION%%.*} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Installation

            Add to your `packages.yml`:
            ```yaml
            packages:
              - package: mercedes-benz/dbt_iterative_snapshot
                version: [">=${{ steps.version.outputs.version }}", "<${{ steps.version.outputs.next_major }}.0.0"]
            ```

            Then run:
            ```bash
            dbt deps
            ```

            ## Changelog
            See [CHANGELOG.md](https://github.com/mercedes-benz/dbt-iterative-snapshot/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
