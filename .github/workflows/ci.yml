name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
  DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
  DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
  DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}
  DBT_DATABRICKS_SCHEMA: ${{ secrets.DBT_DATABRICKS_SCHEMA }}
  DBT_DEV_TABLE_PREFIX: ${{ secrets.DBT_DEV_TABLE_PREFIX }}

jobs:
  # Lint SQL files
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint SQL
        run: sqlfluff lint macros/ --dialect databricks

  # dbt compile check
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt compile
        run: |
          cd integration_tests
          dbt deps
          dbt compile --profiles-dir . --target ci

  # dbt integration tests
  dbt-tests:
    runs-on: ubuntu-latest
    needs: [lint, compile]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dbt tests
        run: |
          cd integration_tests
          dbt deps
          dbt seed --profiles-dir . --target ci
          dbt run --profiles-dir . --target ci
          dbt test --profiles-dir . --target ci

  # Pytest functional tests (out-of-order processing)
  functional-tests:
    runs-on: ubuntu-latest
    needs: [lint, compile]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run functional tests
        run: pytest tests/functional/test_iterative_snapshot.py -s -v
