name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
  DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
  DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
  DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}
  DBT_DATABRICKS_SCHEMA: ${{ secrets.DBT_DATABRICKS_SCHEMA }}
  DBT_DEV_TABLE_PREFIX: ${{ secrets.DBT_DEV_TABLE_PREFIX }}

jobs:
  # DCO (Developer Certificate of Origin) sign-off check
  dco-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          COMMITS=$(git log --no-merges --format='%H' "$BASE_SHA"..HEAD)
          FAILED=0
          for HASH in $COMMITS; do
            if [ -z "$HASH" ]; then continue; fi
            if ! git log -1 --format='%B' "$HASH" | grep -q "^Signed-off-by: "; then
              SUBJECT=$(git log -1 --format='%s' "$HASH")
              echo "::error::Commit ${HASH:0:7} ($SUBJECT) is missing Signed-off-by line"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more commits are missing DCO sign-off. Please use 'git commit -s'."
            exit 1
          fi
          echo "All commits have DCO sign-off."

  # dbt compile check
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt compile
        run: |
          cd integration_tests
          dbt deps
          dbt compile --profiles-dir . --target ci

  # dbt integration tests
  dbt-tests:
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dbt tests
        run: |
          cd integration_tests
          dbt deps
          dbt seed --profiles-dir . --target ci
          dbt run --profiles-dir . --target ci
          dbt test --profiles-dir . --target ci

  # Pytest functional tests (out-of-order processing)
  functional-tests:
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run functional tests
        run: pytest tests/functional/test_iterative_snapshot.py -s -v

  # Black Duck SCA (Software Composition Analysis) scan
  blackduck-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Black Duck SCA Scan
        continue-on-error: true
        uses: blackduck-inc/black-duck-security-scan@v2
        env:
          DETECT_PROJECT_NAME: dbt-iterative-snapshot
          DETECT_PROJECT_VERSION_NAME: ${{ github.ref_name }}
        with:
          blackducksca_url: https://mercedes-benz.app.blackduck.com/
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: ${{ github.event_name == 'push' }}
